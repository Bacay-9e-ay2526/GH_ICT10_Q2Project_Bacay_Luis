<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>Basketball Varsity Tryouts - Homepage</title>
    <style>
        :root {
            --navy: #0b1d3a;
            --navy-dark: #050e1c;
            --orange: #ff6600;
            --orange-light: #ff944d;
            --steel: #15161a;
            --steel-light: #23252c;
            --gold: #f0b323;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }

        body {
            display: flex;
            flex-direction: column;
            font-family: 'Rajdhani', sans-serif;
            color: #f4f4f4;
            background:
                radial-gradient(circle at 50% 0%, rgba(255, 102, 0, 0.25), transparent 55%),
                linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(90deg, var(--navy-dark), var(--navy) 50%, var(--navy-dark));
            border-bottom: 3px solid var(--orange);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--orange-light);
            text-decoration: none;
        }

        .nav-brand .basketball-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--orange) 40%, var(--navy-dark) 80%);
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--orange);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 0.55rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--orange-light);
            text-decoration: none;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid transparent;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .nav-links a:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--orange);
            box-shadow: 0 0 12px rgba(255, 102, 0, 0.45);
        }

        .nav-links a[aria-current="page"] {
            color: var(--navy-dark);
            background: var(--orange);
            border-color: var(--orange-light);
        }

        header {
            text-align: center;
            padding: 2rem 1rem 0.5rem;
        }

        .hero-ball {
            width: 64px;
            height: 64px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--orange) 35%, #b33600 70%, var(--navy-dark) 100%);
            border: 4px solid var(--gold);
            box-shadow: 0 0 18px var(--orange), 0 0 40px rgba(255, 102, 0, 0.5);
        }

        header h1 {
            margin: 0;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--orange);
            text-shadow: 0 0 12px rgba(255, 102, 0, 0.4);
        }

        header p {
            margin: 0.3rem 0 0;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #c9c9c9;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem 2rem;
        }

        form {
            width: 100%;
            max-width: 420px;
            padding: 2rem;
            background: linear-gradient(145deg, var(--steel-light), var(--steel));
            border: 2px solid var(--orange);
            border-top: 6px solid var(--gold);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        form input[type="text"] {
            width: 100%;
            margin-bottom: 1rem;
            padding: 0.8rem 1rem;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            background: #0e0f12;
            border: 1px solid #4a4d57;
            border-radius: 6px;
            outline: none;
        }

        form input[type="text"]:focus {
            border-color: var(--orange);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
        }

        form input[type="button"] {
            width: 100%;
            padding: 0.85rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fff;
            background: linear-gradient(180deg, var(--orange) 0%, #b33600 100%);
            border: 2px solid var(--gold);
            border-radius: 6px;
            cursor: pointer;
        }

        #result {
            width: 100%;
            max-width: 420px;
            margin-top: 1.5rem;
            padding: 1rem 1.25rem;
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            color: var(--orange-light);
            background: rgba(255, 102, 0, 0.1);
            border-left: 5px solid var(--orange);
            border-radius: 6px;
        }

        #result:empty { display: none; }

        footer {
            text-align: center;
            padding: 1.2rem 1rem;
            font-size: 0.95rem;
            letter-spacing: 0.08em;
            color: #d6d6d6;
            background: linear-gradient(90deg, var(--navy-dark), var(--navy), var(--navy-dark));
            border-top: 4px solid var(--orange);
        }
        footer span { color: var(--orange-light); font-weight: 600; }
    </style>
</head>
<body>
    <nav class="navbar" aria-label="Main navigation">
        <a class="nav-brand" href="index.html">
            <span class="basketball-icon" aria-hidden="true"></span>
            Varsity Portal
        </a>
        <ul class="nav-links">
            <li><a href="index.html" aria-current="page">Tryout Checker</a></li>
            <li><a href="Element Checker.html">Drills Ref</a></li>
            <li><a href="School Club Members.html">Team Roster</a></li>
            <li><a href="Creator.html">Meet the Creator</a></li>
        </ul>
    </nav>

    <header>
        <div class="hero-ball"></div>
        <h1>Varsity Tryout Portal</h1>
        <p>Candidate Verification System</p>
    </header>

    <main>
        <form>
            <input type="text" id="first_name" placeholder="Enter First Name"><br>
            <input type="text" id="last_name" placeholder="Enter Last Name"><br>
            <input type="button" py-click="candidate_checker" value="Verify Tryout Status">
        </form>
        <div id="result"></div>
    </main>

    <footer>
        &copy; 2026 <span>Basketball Varsity</span> &bull; Project &bull; Greenhills Campus
    </footer>

    <py-script src="main.py"></py-script>
</body>
</html>
