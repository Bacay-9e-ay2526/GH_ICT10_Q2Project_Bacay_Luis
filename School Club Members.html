<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <title>Basketball Team Roster - Drill 2</title>
    <style>
        :root {
            --navy: #0b1d3a;
            --navy-dark: #050e1c;
            --orange: #ff6600;
            --orange-light: #ff944d;
            --steel: #15161a;
            --steel-light: #23252c;
            --gold: #f0b323;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: linear-gradient(180deg, var(--navy) 0%, var(--navy-dark) 100%);
            color: #f4f4f4;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            padding: 0.6rem 1.5rem;
            background: linear-gradient(90deg, var(--navy-dark), var(--navy) 50%, var(--navy-dark));
            border-bottom: 3px solid var(--orange);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--orange-light);
            text-decoration: none;
        }

        .nav-brand .basketball-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, var(--orange) 40%, var(--navy-dark) 80%);
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--orange);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-links a {
            display: block;
            padding: 0.55rem 1rem;
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.78rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--orange-light);
            text-decoration: none;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid transparent;
            border-radius: 6px;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .nav-links a:hover {
            background: rgba(0, 0, 0, 0.5);
            border-color: var(--orange);
            box-shadow: 0 0 12px rgba(255, 102, 0, 0.45);
        }

        .nav-links a[aria-current="page"] {
            color: var(--navy-dark);
            background: var(--orange);
            border-color: var(--orange-light);
        }

        .card-box {
            background: linear-gradient(145deg, var(--steel-light), var(--steel));
            border: 2px solid var(--orange);
            border-top: 6px solid var(--gold);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .form-label {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--orange-light);
        }

        .form-label i { color: var(--orange); }

        .form-control {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            background: #0e0f12;
            border: 1px solid #4a4d57;
            border-radius: 6px;
        }

        .form-control:focus {
            background: #0e0f12;
            border-color: var(--orange);
            box-shadow: 0 0 10px rgba(255, 102, 0, 0.5);
            color: #fff;
        }

        .btn-submit {
            background: linear-gradient(180deg, var(--orange) 0%, #b33600 100%);
            border: 2px solid var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #fff;
            padding: 0.85rem;
            border-radius: 6px;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .btn-submit:hover { 
            transform: translateY(-2px);
            box-shadow: 0 0 18px rgba(255, 102, 0, 0.9);
            color: #fff; 
        }

        #output {
            background: rgba(255, 102, 0, 0.1);
            border-left: 5px solid var(--orange);
            color: var(--orange-light);
            font-size: 1.15rem;
            font-weight: 600;
        }
        #output:empty { display: none; }

        .site-footer {
            text-align: center;
            padding: 1.2rem 1rem;
            font-size: 0.95rem;
            color: #d6d6d6;
            background: linear-gradient(90deg, var(--navy-dark), var(--navy), var(--navy-dark));
            border-top: 4px solid var(--orange);
        }
        .site-footer span { color: var(--orange-light); font-weight: 600; }
    </style>
</head>
<body>

    <nav class="navbar" aria-label="Main navigation">
        <a class="nav-brand" href="./index.html">
            <span class="basketball-icon" aria-hidden="true"></span>
            Varsity Portal
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Tryout Checker</a></li>
            <li><a href="Element Checker.html">Drills Ref</a></li>
            <li><a href="School Club Members.html" aria-current="page">Team Roster</a></li>
            <li><a href="Creator.html">Meet the Creator</a></li>
        </ul>
    </nav>

    <div class="container mt-5 mb-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-7 card-box">
                <h3 class="mb-4 font-monospace text-warning text-uppercase text-center">Add New Basketball Roster Member</h3>
                <form class="mb-3">
                    <div class="mb-3">
                        <label class="form-label" for="first_name">
                            <i class="bi bi-person-fill"></i> First Name
                        </label>
                        <input type="text" id="first_name" class="form-control form-control-lg" placeholder="Enter first name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="last_name">
                            <i class="bi bi-person-fill"></i> Last Name
                        </label>
                        <input type="text" id="last_name" class="form-control form-control-lg" placeholder="Enter last name">
                    </div>
                    <div class="d-grid mt-4">
                        <input type="button" value="Add to Roster" py-click="result_checker" class="btn btn-submit btn-lg">
                    </div>
                </form>
                <div id="output" class="p-3 rounded mt-3"></div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        &copy; 2026 <span>Basketball Varsity</span> &bull; Project &bull; Greenhills Campus
    </footer>

    <py-script src="main.py"></py-script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
